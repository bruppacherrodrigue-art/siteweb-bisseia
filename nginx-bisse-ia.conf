# ─────────────────────────────────────────────────────────────────────────────
# Configuration nginx pour bisse-ia.ch (conteneur `bisse-site`, image nginx:alpine)
#
# Ce fichier REMPLACE le server{} par défaut de nginx. Il ajoute la COMPRESSION
# (gzip) et consolide le CACHE. Il est prévu pour être monté à la place du
# default.conf, exactement comme l'actuel /srv/bisse-ia/nginx-site.conf.
#
# ── ÉTAT ACTUEL ──────────────────────────────────────────────────────────────
#   Le Cache-Control est DÉJÀ en prod (via /srv/bisse-ia/nginx-site.conf, monté
#   sur /etc/nginx/conf.d/default.conf) : `no-cache` sur le HTML, `max-age=2592000`
#   (30 j) sur les assets. Ce qui MANQUE = la compression gzip.
#   Ce fichier ajoute gzip ET passe le cache des assets à 1 an.
#
# ── APPLICATION (à faire par Rodrigue, Claude n'a pas les droits VPS) ─────────
#   1. Copier ce fichier sur le VPS :
#        scp nginx-bisse-ia.conf cc-vps:/srv/bisse-ia/nginx-site.conf
#      (il écrase l'actuel nginx-site.conf, déjà monté — pas de changement de compose)
#   2. Valider AVANT d'appliquer (conteneur jetable, ne touche pas le live) :
#        ssh cc-vps 'docker run --rm -v /srv/bisse-ia/nginx-site.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine nginx -t'
#   3. Recharger :
#        ssh cc-vps 'cd /srv/bisse-ia && docker compose up -d site'
#   4. Vérifier :
#        curl -sI -H 'Accept-Encoding: gzip' https://bisse-ia.ch/ | grep -i 'content-encoding\|cache-control'
#        curl -sI https://bisse-ia.ch/fonts/figtree-var.woff2 | grep -i cache-control
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ── Compression gzip (module de base, toujours disponible) ────────────────
    gzip              on;
    gzip_vary         on;             # ajoute "Vary: Accept-Encoding"
    gzip_comp_level   6;
    gzip_min_length   1024;           # ne pas compresser les tout petits fichiers
    gzip_proxied      any;
    gzip_types
        text/html
        text/css
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # NB : text/html est TOUJOURS compressé quand gzip est activé (pas besoin de le lister).

    # ── Brotli (meilleur que gzip, mais ABSENT de nginx:alpine stock) ─────────
    # Décommenter UNIQUEMENT si l'image nginx embarque le module ngx_brotli
    # (ex. image `fholzer/nginx-brotli` ou nginx recompilé). Sur nginx:alpine
    # standard ces directives font échouer `nginx -t`.
    #   brotli            on;
    #   brotli_comp_level 5;
    #   brotli_types      text/css text/plain application/javascript application/json application/xml image/svg+xml;

    # ── Cache ─────────────────────────────────────────────────────────────────
    # HTML : jamais mis en cache dur → les visiteurs qui reviennent obtiennent
    # toujours la dernière version (corrige le bug « ancien site en cache »).
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    # Assets statiques : cache long (1 an). immutable = pas de revalidation.
    # ⚠️ Comme les noms ne sont pas hashés, RENOMMER un asset quand on le change
    # (ex. hero-petrole.webp -> hero-petrole-2.webp) pour forcer le rechargement.
    location ~* \.(?:woff2|woff|ttf|otf|png|jpe?g|gif|webp|svg|ico|js|css|mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
